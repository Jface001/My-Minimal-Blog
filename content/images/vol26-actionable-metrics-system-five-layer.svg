<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">指标体系五层框架</title>
<desc id="desc">先有业务目标，再有指标口径、数据模型和经营动作。</desc>
<defs>
  <style>
    .bg{fill:#fbfdff}.title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#111827}.subtitle{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#526071}.box-title{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#111827}.box-text{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#374151}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
</defs>
<rect class="bg" width="100%" height="100%" rx="28"/>
<text class="title" x="48" y="62">指标体系五层框架</text>
<text class="subtitle" x="48" y="94">先有业务目标，再有指标口径、数据模型和经营动作。</text>
<path class="arrow" d="M260,214 L300,214"/>
<path class="arrow" d="M480,214 L520,214"/>
<path class="arrow" d="M700,214 L740,214"/>
<path class="arrow" d="M920,214 L960,214"/>
<path class="arrow" d="M600,263 L600,390"/>
<rect x="80" y="165" width="180" height="98" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text class="box-title" x="98" y="197">目标层</text>
<text class="box-text" x="98" y="223">北极星指标</text>
<text class="box-text" x="98" y="244">季度目标</text>
<rect x="300" y="165" width="180" height="98" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text class="box-title" x="318" y="197">业务过程层</text>
<text class="box-text" x="318" y="223">业务链路 主题域</text>
<rect x="520" y="165" width="180" height="98" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text class="box-title" x="538" y="197">指标层</text>
<text class="box-text" x="538" y="223">指标树 原子指标</text>
<rect x="740" y="165" width="180" height="98" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text class="box-title" x="758" y="197">数据层</text>
<text class="box-text" x="758" y="223">口径 模型</text>
<text class="box-text" x="758" y="244">质量规则</text>
<rect x="960" y="165" width="180" height="98" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text class="box-title" x="978" y="197">应用层</text>
<text class="box-text" x="978" y="223">看板 预警 复盘</text>
<rect x="230" y="390" width="740" height="88" rx="14" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<text class="box-title" x="248" y="422">执行闭环</text>
<text class="box-text" x="248" y="448">看什么 为什么看 怎么算 谁负责 异常后怎么行动</text>
</svg>
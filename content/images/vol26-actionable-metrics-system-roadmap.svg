<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">八周落地路线图</title>
<desc id="desc">先跑通一个业务域 MVP，再逐步扩展到全域治理。</desc>
<defs>
  <style>
    .bg{fill:#fbfdff}.title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#111827}.subtitle{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#526071}.box-title{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#111827}.box-text{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#374151}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
</defs>
<rect class="bg" width="100%" height="100%" rx="28"/>
<text class="title" x="48" y="62">八周落地路线图</text>
<text class="subtitle" x="48" y="94">先跑通一个业务域 MVP，再逐步扩展到全域治理。</text>
<path class="arrow" d="M310,214 L350,214"/>
<path class="arrow" d="M580,214 L620,214"/>
<path class="arrow" d="M850,214 L890,214"/>
<path class="arrow" d="M600,263 L600,390"/>
<rect x="80" y="165" width="230" height="98" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text class="box-title" x="98" y="197">第 1-2 周</text>
<text class="box-text" x="98" y="223">目标与业务链路</text>
<rect x="350" y="165" width="230" height="98" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text class="box-title" x="368" y="197">第 3-4 周</text>
<text class="box-text" x="368" y="223">指标树与指标口径</text>
<rect x="620" y="165" width="230" height="98" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text class="box-title" x="638" y="197">第 5-6 周</text>
<text class="box-text" x="638" y="223">数据源盘点与建模</text>
<rect x="890" y="165" width="230" height="98" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text class="box-title" x="908" y="197">第 7-8 周</text>
<text class="box-text" x="908" y="223">看板预警与试运行</text>
<rect x="250" y="390" width="700" height="88" rx="14" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<text class="box-title" x="268" y="422">验收标准</text>
<text class="box-text" x="268" y="448">固定使用 能定位问题 口径争议减少 有 owner 与质量监控</text>
</svg>